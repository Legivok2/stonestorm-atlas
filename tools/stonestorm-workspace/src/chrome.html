<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'"><title>Workspace vezérlők</title><link rel="stylesheet" href="chrome.css"></head><body>
<header class="toolbar"><b class="toolbar-brand">STONESTORM<small>WORKSPACE</small></b>
<nav class="workspace-tabs" aria-label="Munkaterület"><button data-action="workspace" data-value="GAME" id="game-mode" aria-pressed="true">Játék</button><button data-action="workspace" data-value="MINING" id="mining-mode" aria-pressed="false">Tárnák – 4 panel</button></nav>
<button data-action="workspace" data-value="GAME" id="mining-return" class="return-game" hidden>Tárnák bezárása / Vissza a játékhoz</button>
<select id="mode" aria-label="Tárnák elrendezése" hidden><option value="columns">4 × 1</option><option value="grid">2 × 2</option></select>
<div class="toolbar-actions"><button data-action="back" id="back" title="Vissza"><span aria-hidden="true">←</span><span class="secondary-label"> Vissza</span></button><button data-action="refresh" id="refresh" title="Aktuális nézet frissítése; a beírt értékek elveszhetnek"><span aria-hidden="true">↻</span><span class="secondary-label"> Frissítés</span></button><button data-action="fullscreen" aria-label="Teljes képernyő" title="Teljes képernyő · F11">⛶</button><button data-action="settings" id="settings-toggle" aria-expanded="false" aria-controls="settings" title="Beállítások">⚙<span class="secondary-label"> Beállítások</span></button></div><span id="message" class="sr-only" role="status"></span></header>
<section id="settings" aria-label="Workspace beállításai" hidden><div class="settings-title"><h1>Beállítások</h1><button data-action="settings" data-value="false">Bezárás ×</button></div><div class="settings-grid">
<div><h2>Indítás</h2><label><input id="remember-workspace" type="checkbox">Utoljára használt munkaterület megjegyzése</label><p>Kikapcsolva mindig a normál játék indul.</p></div>
<div><h2>Tárnák</h2><label>Elrendezés<select id="setting-layout"><option value="columns">4 × 1</option><option value="grid">2 × 2</option></select></label><label><input id="save-sizes" type="checkbox" checked>Panelméretek mentése</label><label><input id="compact" type="checkbox" checked>Kompakt Tárnák megjelenítés</label></div>
<div><h2>Ablak</h2><label><input id="fullscreen" type="checkbox">Teljes képernyő</label><button data-action="reset">Panelméretek alaphelyzetbe</button><p>A beállítások ezen a gépen maradnak.</p></div>
<div><h2>Nyelv / Language</h2><label>Nyelv / Language<select id="language"><option value="hu">Magyar</option><option value="en">English</option></select></label></div>
</div></section><main id="headers"></main><div id="separators"></div><script src="i18n.js"></script><script src="chrome.js"></script></body></html>
